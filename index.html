<!-- আগের জাভাস্ক্রিপ্ট স্ক্রিপ্ট ট্যাগের ভেতরের কোডটি এভাবে আপডেট করুন -->
<script>
    async function fetchData() {
        let input = document.getElementById('videoInput').value.trim();
        if (!input) {
            alert('দয়া করে একটি ভিডিও আইডি বা লিঙ্ক দিন!');
            return;
        }

        let videoId = input;
        if (input.includes('youtube.com') || input.includes('youtu.be')) {
            try {
                const url = new URL(input);
                videoId = url.searchParams.get('v') || input.split('/').pop().split('?')[0];
            } catch (e) {
                videoId = input.split('/').pop().split('?')[0];
            }
        }

        const resultDiv = document.getElementById('result');
        const copyBtn = document.getElementById('copyBtn');
        
        resultDiv.innerHTML = '<p class="text-slate-400">লোড হচ্ছে, দয়া করে অপেক্ষা করুন...</p>';
        copyBtn.classList.add('hidden');

        try {
            const response = await fetch(`/api/get-languages/${videoId}`);
            const data = await response.json();
            
            if (Array.isArray(data) && data.length > 0) {
                let html = `
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">ভাষা নির্বাচন করুন:</label>
                            <select id="selectedLang" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-red-500 transition">
                `;
                
                data.forEach(lang => {
                    html += `<option value="${lang.id}">${lang.name} (${lang.id})</option>`;
                });
                
                html += `</select></div>
                         <button onclick="downloadMp3('${videoId}')" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-green-600/30">
                            <i class="fa-solid fa-download"></i> MP3 ডাউনলোড করুন
                         </button>
                        </div>`;
                
                resultDiv.innerHTML = html;
            } else {
                resultDiv.innerHTML = `<pre class="text-slate-300">${JSON.stringify(data, null, 4)}</pre>`;
            }
            
        } catch (error) {
            resultDiv.textContent = 'ত্রুটি ঘটেছে: ' + error.message;
        }
    }

    function downloadMp3(videoId) {
        const langId = document.getElementById('selectedLang').value;
        // এখানে আপনি ডাউনলোডের জন্য ব্যাকএন্ড রাউটে রিকোয়েস্ট পাঠাতে পারেন অথবা সরাসরি API লিঙ্কে রিডায়রেক্ট করতে পারেন
        alert(`ভিডিও আইডি: ${videoId} এবং ভাষা: ${langId} এর জন্য MP3 ডাউনলোড প্রসেস শুরু হচ্ছে...`);
        
        // উদাহরণস্বরূপ ব্যাকএন্ডে ডাউনলোড এপিআই কল করার কোড:
        window.location.href = `/api/download-mp3?videoId=${videoId}&lang=${langId}`;
    }
</script>
